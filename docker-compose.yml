services:
  vector-db:
    image: qdrant/qdrant:latest
    container_name: docuquery-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"   # gRPC port
    volumes:
      - qdrant_storage:/qdrant/storage   # persistent! data survives restarts
    environment:
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local